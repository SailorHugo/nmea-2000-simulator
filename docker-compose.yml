version: '3.8'

services:
  nmea-simulator:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web interface
      - "10110:10110" # NMEA TCP primary
      - "4001:4001"   # NMEA TCP secondary
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nmea_user:nmea_password_secure_2024@db:5432/nmea_simulator
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nmea-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nmea_simulator
      - POSTGRES_USER=nmea_user
      - POSTGRES_PASSWORD=nmea_password_secure_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmea_user -d nmea_simulator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nmea-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - nmea-simulator
    networks:
      - nmea-network

volumes:
  postgres_data:

networks:
  nmea-network:
    driver: bridge