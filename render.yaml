services:
  - type: web
    name: nmea-simulator
    env: node
    region: oregon
    buildCommand: npm ci && ./simple-build.sh && cd dist && npm install --production
    startCommand: cd dist && npm start
    plan: starter
    healthCheckPath: /api/pgn-configurations
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nmea-postgres
          property: connectionString

databases:
  - name: nmea-postgres
    databaseName: nmea_simulator
    user: nmea_user
    plan: starter